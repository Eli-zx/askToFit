<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2eee6" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 在样式与 Vue 挂载前先确定主题，避免暗色浏览器里闪一帧白底
      ;(function () {
        try {
          var stored = localStorage.getItem('asktofit.theme') || 'system'
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark = stored === 'dark' || (stored === 'system' && prefersDark)
          var root = document.documentElement
          root.dataset.theme = isDark ? 'dark' : 'light'
          if (isDark) root.classList.add('dark')
          root.style.colorScheme = isDark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', isDark ? '#0b0b0a' : '#f2eee6')
        } catch (error) {
          // 忽略隐私模式下的存储异常
        }
      })()
    </script>
    <meta
      name="description"
      content="AskToFit 售前智能导购 —— 基于电商服装知识库的智能问答系统"
    />
    <title>AskToFit · 售前智能导购</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
