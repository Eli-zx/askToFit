[project]
name = "asktofit"
version = "0.1.0"
description = "基于电商服装售前知识的问答系统"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
    "python-dotenv>=1.0.1",
    "PyJWT>=2.9.0",
    "bcrypt>=4.2.0",
    "redis>=5.2.0",
    "pymilvus>=2.4.9,<2.5",
    "setuptools>=70.0.0,<81",
    "pillow>=11.0.0",
    "openai>=1.54.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "python-pptx>=1.0.2",
    "python-docx>=1.1.2",
    "markdown>=3.7",
    "FlagEmbedding>=1.3.3",
    "torch>=2.6.0",
    "transformers>=5.0.0",
    "rapidocr-onnxruntime>=1.4.4",
    "numpy>=2.0.0",
    "olefile>=0.47",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.6.0",
    "aiosqlite>=0.20.0",
    "fakeredis>=2.26.0",
    "scikit-learn>=1.5.0",
]

loadtest = [
    "locust>=2.32.0,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

# torch 固定走 CPU 索引，避免 Linux 镜像拉入 CUDA / NVIDIA 依赖
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
package = false
